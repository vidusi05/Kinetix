services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kinetix
      POSTGRES_USER: kinetix
      POSTGRES_PASSWORD: kinetix
    ports:
      - "5432:5432"
    volumes:
      - kinetix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetix -d kinetix"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

volumes:
  kinetix_pgdata:
